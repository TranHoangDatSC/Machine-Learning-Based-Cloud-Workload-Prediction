# Chia du lieu. Xem docs/protocol.md muc 9 va 10.
shuffle: false               # TUYET DOI KHONG DOI
train: 0.70
val: 0.15
test: 0.15

# QD-013 diem 1-2. Ranh gioi tinh theo BUCKET cua cua so 2304, khong theo so dong.
#   train [0, 1612)  val [1612, 1957)  test [1957, 2304)
# Mot dong thuoc tap S khi CA t VA t+h nam trong S; dong vat qua ranh gioi bi LOAI.
# Gan theo t thoi la RO RI: dong cuoi tap train se co target roi vao val hoac test.
boundary: bucket
purge_straddling: true
# QD-014 diem 1. Vung validation [1612, 1957) rong 345 bucket, chia 5 duoc 69 moi fold.
# Luat purge o tren ap TRONG TUNG FOLD. Test [1957, 2304) khong fold nao cham toi.
cv:
  method: rolling_origin
  mode: expanding              # KHONG dung sliding: cua so chi 8 ngay, train cua fold
                               # cuoi se ngan toi muc vo nghia. Expanding cung khop
                               # cach he thong that chay: cang ve sau cang nhieu lich su.
  n_splits: 5
  val_bucket_per_fold: 69
  bien_fold: [1612, 1681, 1750, 1819, 1888, 1957]   # code ra bo so khac la hieu sai
horizons: [1, 6, 12]
strategy: direct

# QD-014 diem 2. Chi kich hoat neu SVR qua cham; sau model kia luon chay 100%.
svr_subsample:
  lay_tren: dong_huan_luyen    # KHONG lay tren chuoi: bo bot chuoi la doi QUAN THE,
                               # moi ket luan muc chuoi se khong so duoc voi 6 model kia
  stratify_by: cv_tier         # ba tang cua QD-012, giu nguyen ti le
  random_state: 42
  dung_chung_moi_horizon: true
  test_giu_nguyen: true        # bay model phai cham tren dung cung bo dong

normalize_modes: [N0, N1, N2]   # thi nghiem B, xem muc 14
fit_stats_on: train_only        # chong ro ri

# Phan tang khi BAO CAO ket qua TN-A. Xem docs/protocol.md muc 13 va QD-012.
# Nguong tuyet doi dung chung cho ba moi truong la SAI: tuong quan giua CV va muc tai
# doi dau giua Bitbrains (+0,375 / +0,249) va Alibaba (-0,692), va tam phan vi cua E3
# chi rong 0,06 nen se bi don het vao mot tang.
stratify:
  by: cv
  method: percentile_within_env   # KHONG dung nguong tuyet doi chung
  n_strata: 3
  report_column: ti_le_cham_chan  # CV / sqrt((100-m)/m), phan biet it bursty that
                                  # voi it bursty vi da cung tran thang do
  # CV trong results/tables/cv_gd2.csv tinh tren TOAN BO cua so 8 ngay.
  # Dung de nhom chuoi khi doc bang thi khong sao. Dung lam DAC TRUNG hay tieu chi
  # CHON MODEL thi la ro ri -> phai tinh lai chi tren cua so train.
  chi_dung_de_bao_cao: true
